<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h2 style="color: #333;">Welcome aboard, <span th:text="${userName}">User</span>! 🎉</h2>

        <p style="color: #555; line-height: 1.6;">
            Your email has been successfully verified. You're all set to start using your account.
        </p>

        <p style="color: #555; line-height: 1.6;">
            If you have any questions, feel free to reply to this email.
        </p>

        <p style="color: #aaa; font-size: 12px; margin-top: 40px;">
            — The Universal Auth Team
        </p>
    </div>
</body>
</html>
