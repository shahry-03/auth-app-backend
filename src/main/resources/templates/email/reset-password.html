<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset your password</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h2 style="color: #333;">Password Reset Request</h2>

        <p style="color: #555; line-height: 1.6;">
            Hi <span th:text="${userName}">User</span>,
            we received a request to reset your password.
        </p>

        <p style="text-align: center; margin: 40px 0;">
            <a th:href="${resetLink}"
               style="background-color: #e74c3c; color: white; padding: 14px 32px;
                      text-decoration: none; border-radius: 4px; display: inline-block;
                      font-weight: bold;">
                Reset Password
            </a>
        </p>

        <p style="color: #888; font-size: 13px;">
            Or copy this link:<br>
            <a th:href="${resetLink}" th:text="${resetLink}"
               style="color: #e74c3c; word-break: break-all;">link</a>
        </p>

        <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">

        <p style="color: #aaa; font-size: 12px;">
            This link expires in <span th:text="${expiryMinutes}">30</span> minutes.<br>
            If you didn't request a password reset, please ignore this email.
            Your password will remain unchanged.
        </p>
    </div>
</body>
</html>
