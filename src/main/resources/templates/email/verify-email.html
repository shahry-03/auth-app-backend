<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify your email</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h2 style="color: #333;">Welcome, <span th:text="${userName}">User</span>!</h2>

        <p style="color: #555; line-height: 1.6;">
            Thanks for signing up. Please verify your email address to activate your account.
        </p>

        <p style="text-align: center; margin: 40px 0;">
            <a th:href="${verificationLink}"
               style="background-color: #4CAF50; color: white; padding: 14px 32px;
                      text-decoration: none; border-radius: 4px; display: inline-block;
                      font-weight: bold;">
                Verify Email
            </a>
        </p>

        <p style="color: #888; font-size: 13px; line-height: 1.6;">
            Or copy this link into your browser:<br>
            <a th:href="${verificationLink}" th:text="${verificationLink}"
               style="color: #4CAF50; word-break: break-all;">link</a>
        </p>

        <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">

        <p style="color: #aaa; font-size: 12px;">
            This link expires in <span th:text="${expiryHours}">24</span> hours.<br>
            If you didn't create an account, you can safely ignore this email.
        </p>
    </div>
</body>
</html>
