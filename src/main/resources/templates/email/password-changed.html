<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password changed</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px;">
        <h2 style="color: #333;">Password Changed</h2>

        <p style="color: #555; line-height: 1.6;">
            Hi <span th:text="${userName}">User</span>,
            your password was successfully changed.
        </p>

        <p style="color: #e74c3c; font-weight: bold; line-height: 1.6;">
            ⚠️ If you didn't make this change, please contact support immediately.
            For security, all active sessions have been logged out.
        </p>

        <p style="color: #aaa; font-size: 12px; margin-top: 40px;">
            — The Universal Auth Team
        </p>
    </div>
</body>
</html>
