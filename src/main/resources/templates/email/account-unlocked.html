<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body style="font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 40px;">
        <h2 style="color: #4CAF50;">✅ Account Unlocked</h2>
        <p style="color: #555; line-height: 1.6;">
            Hi <span th:text="${userName}">User</span>,
        </p>
        <p style="color: #555; line-height: 1.6;">
            Your account has been unlocked. You can now log in with your credentials.
        </p>
        <p style="color: #aaa; font-size: 12px; margin-top: 40px;">— The Universal Auth Team</p>
    </div>
</body>
</html>
