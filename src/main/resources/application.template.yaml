# ============================================================
#  application-template.yaml
#  Reference template for Universal Auth service
#  ------------------------------------------------------------
#  DO NOT use this file at runtime.
#  Copy values into application-dev.yaml / application-prod.yaml
#  or override via environment variables / secrets manager.
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://<DB_HOST>:<DB_PORT>/<DB_NAME>?useSSL=<true|false>&allowPublicKeyRetrieval=<true|false>
    username: <DB_USERNAME>
    password: <DB_PASSWORD>
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate            # never use 'update' or 'create' in prod
    properties:
      hibernate:
        format_sql: <true|false>
    show-sql: <true|false>

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true            # ALWAYS true in prod

  mail:
    host: <SMTP_HOST>               # e.g. sandbox.smtp.mailtrap.io / smtp.gmail.com
    port: <SMTP_PORT>               # 587 (STARTTLS) / 465 (SSL)
    username: <SMTP_USERNAME>
    password: <SMTP_PASSWORD>
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: <GOOGLE_CLIENT_ID>
            client-secret: <GOOGLE_CLIENT_SECRET>
            scope:
              - email
              - profile
          github:
            client-id: <GITHUB_CLIENT_ID>
            client-secret: <GITHUB_CLIENT_SECRET>
            scope:
              - read:user
              - user:email

server:
  port: <SERVER_PORT>               # default: 8080

universal:
  auth:
    jwt:
      secret: <JWT_SECRET>                         # min 256-bit random string
      expiration: <JWT_EXPIRATION_MS>              # e.g. 3600000 (1h)
      refresh-token-expiration: <REFRESH_MS>       # e.g. 604800000 (7d)
      issuer: universal-auth
    oauth2:
      enabled: <true|false>
    cookie:
      refresh-token-name: refresh_token
      secure: <true in prod | false in dev>        # HTTPS-only cookie
      http-only: true
      same-site: <Lax|Strict|None>
      domain: <COOKIE_DOMAIN>                      # e.g. .yourdomain.com
    frontend:
      success-redirect: <OAUTH_SUCCESS_REDIRECT_URL>

app:
  rate-limit:
    enabled: <true|false>
    cleanup-interval-minutes: 10
  security:
    account-lockout:
      enabled: <true|false>
      max-failed-attempts: 5
      lockout-duration-minutes: 15
      reset-counter-after-minutes: 30
      notify-on-lock: true
  frontend:
    base-url: <FRONTEND_BASE_URL>                  # e.g. http://localhost:3000 (dev)
                                                   #      https://app.yourdomain.com (prod)
  mail:
    from: <MAIL_FROM_ADDRESS>                      # e.g. noreply@yourdomain.com
    from-name: <MAIL_FROM_NAME>                    # e.g. Universal Auth
  2fa:
    issuer: Universal Auth                         # shown in Google Authenticator