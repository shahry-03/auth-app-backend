spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/authdb?useSSL=true&requireSSL=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: AuthHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true               # Production safety — DO NOT set false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework     # important behind reverse proxy (Nginx/ALB)
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful

universal:
  auth:
    jwt:
      secret: ${JWT_SECRET}                     # 256-bit+ random secret
      expiration: ${JWT_EXPIRATION:3600000}     # 1 hour
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}   # 7 days
      issuer: universal-auth
    oauth2:
      enabled: true
    cookie:
      refresh-token-name: refresh_token
      secure: true                              # HTTPS only in prod
      http-only: true
      same-site: Strict
      domain: ${COOKIE_DOMAIN}
    frontend:
      success-redirect: ${OAUTH_SUCCESS_REDIRECT:https://yourdomain.com/oauth/success}

app:
  rate-limit:
    enabled: true
    cleanup-interval-minutes: 10
  security:
    account-lockout:
      enabled: true
      max-failed-attempts: 5
      lockout-duration-minutes: 15
      reset-counter-after-minutes: 30
      notify-on-lock: true
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://yourdomain.com}
  mail:
    from: ${MAIL_FROM:noreply@yourdomain.com}
    from-name: ${MAIL_FROM_NAME:Universal Auth}
  2fa:
    issuer: Universal Auth

logging:
  level:
    root: WARN
    com.yourpackage: INFO           # apna base package daalna
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: ${LOG_FILE_PATH:/var/log/universal-auth/application.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized