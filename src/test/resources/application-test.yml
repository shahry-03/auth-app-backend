spring:
  jpa:
    hibernate:
      ddl-auto: validate       # ← CHANGE: Flyway controls schema
    show-sql: false

  flyway:
    enabled: true              # ← ADD: Enable Flyway in tests
    baseline-on-migrate: false # ← ADD: Fresh container, no baseline
    clean-disabled: true

app:
  rate-limit:
    enabled: false             # ⚡ Disable rate limiting in tests
    cleanup-interval-minutes: 10
  frontend:
    base-url: http://localhost:3000
  mail:
    from: noreply@universal-auth.com
    from-name: Universal Auth
  2fa:
    issuer: Universal Auth Test

universal:
  auth:
    jwt:
      secret: test-secret-key-that-is-at-least-64-bytes-long-for-testing-purposes-only-12345
      expiration: 3600000
      refresh-token-expiration: 604800000
      issuer: universal-auth-test
    oauth2:
      enabled: false
    cookie:
      secure: false
      http-only: true
      same-site: Lax
    frontend:
      success-redirect: http://localhost:3000/test

logging:
  level:
    root: WARN
    com.auth_app_backend: INFO
    org.hibernate.SQL: WARN